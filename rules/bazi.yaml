# 八字规则注册表
#
# 对应工程方案第 25 节 Rule Registry：
#   每个传统规则必须有唯一 ID。
#   以后可以统计：
#       BAZI-R-00427
#       调用次数：214
#       平均增益：+0.018
#       职业预测：有效 / 关系预测：无效
#       日级：无效 / 月级：有效
#
# C-006：八字作为 Traditional Metaphysical Signal 进入系统，
#        其有效性必须由系统自己的长期验证结果决定。
# 因此这里的 rule 只是「待验证信号」的注册，不代表已被证实有效。
#
# 新增术式规则必须通过独立验证（第 7 节）：
#   不允许因为「传统上有名」就获得高权重。

rules:
  # ---------------------------------------------------------------
  # 职业领域
  # ---------------------------------------------------------------
  - rule_id: BAZI-R-官-career
    school: bazi
    description: >
      流日/流月天干为「官杀」（克日主）且目标领域为职业时，
      传统上视为压力/变动之象，方向为负向抑制。
    domains: [career]
    supported_windows: [day, week, month]
    version: "1.0"
    status: active
    definition:
      mechanism: shishen_category
      category: 官
      direction: -1.0
      strength: 0.4
      confidence: 0.35
      note: 弱先验（禁止 6：初始只允许弱先验，长期由实证数据学习）

  - rule_id: BAZI-R-印-career
    school: bazi
    description: >
      流日天干为「印绶」（生日主）且目标领域为职业时，
      传统上视为贵人/资质之象，方向为正向。
    domains: [career, study]
    supported_windows: [day, week, month]
