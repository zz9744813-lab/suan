name: full-flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -e .[dev]
      - name: Run full-flow backend tests
        run: python -m pytest app/tests/test_00_smoke_contract.py app/tests/test_01_health_openapi.py app/tests/test_02_projects_api.py app/tests/test_03_chapters_api.py app/tests/test_04_tasks_command_center.py app/tests/test_05_study_api.py app/tests/test_06_chapter_pipeline_e2e.py app/tests/test_07_worker_control_retry_cancel.py app/tests/test_08_reader_review_discussion.py app/tests/test_09_memory_consolidation.py app/tests/test_10_deepstudy_graph.py app/tests/test_11_model_provider_failover.py app/tests/test_12_sse_audit.py app/tests/test_13_export_search.py app/tests/test_14_performance_smoke.py -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  e2e-placeholder:
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Document Playwright status
        run: Write-Host 'Playwright E2E not enabled yet; add tests after installing @playwright/test.'

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build docker images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for health
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q 'ok'; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose down
