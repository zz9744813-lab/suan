# Alembic configuration for NovelForge 2.0
# 阶段 3.2 引入.
#
# 用法:
#   alembic revision --autogenerate -m "..."   # 生成新迁移
#   alembic upgrade head                        # 应用迁移
#   alembic downgrade -1                        # 回滚一步
#
# 业务运行时不会调用 alembic CLI, 而是在 lifespan / init_db() 里通过
# app.core.migrate.run_alembic_upgrade() 间接驱动.

[alembic]
# 路径在 app/core/migrate.py 里被显式覆盖, 这里是兜底.
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url 由 env.py / migrate.py 注入, 这里留空.
sqlalchemy.url = driver://user:pass@localhost/dbname
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false

[post_write_hooks]
# 阶段 3.2 暂不挂 lint / format hook, 避免和 ruff 配置冲突.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
