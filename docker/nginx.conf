# Frontend nginx config.
# - Serves the Vite static bundle.
# - Proxies /api/* to the backend container (same docker network).
# - Falls back to index.html for SPA routes (/study, /discussion, etc).
# - SSE: disable buffering and short request timeouts so chat streams flow.

upstream novelforge_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # static bundle
    root /usr/share/nginx/html;
    index index.html;

    # gzip on text-ish assets
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/x-font-ttf font/opentype
               image/svg+xml image/x-icon;

    # SPA fallback — Vite produces index.html, all other paths
    # without a dot get rewritten to it. (Has effect for routes like
    # /dashboard, /projects/1/chapters/2.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets in /assets/* — cache forever (filename has hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://novelforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / streaming-friendly: no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # /api/upload can carry a chapter text dump
        client_max_body_size 32m;
    }

    # Health probe
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
